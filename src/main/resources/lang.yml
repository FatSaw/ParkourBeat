      help:
        arrow:
          lore: anchor:ahead появится по курсу, игрок вбежит внутрь.\nanchor:overhead повиснет сверху, для неба.\nanchor:follow поедет за игроком, для ауры.\nanchor:fixed останется там, где поставили.\ndist расстояние вперёд, height высота, side вбок,\nscale общий размер, approach докуда доехать к концу.
          title: Размещение
        blaze_powder:
          lore: particle:end_rod основа всего, дешёвый и яркий.\nflame soul_fire spark crit enchant witch portal\ndragon cloud smoke totem happy heart note lava snow.\nparticle:dust единственный с любым цветом и самый\nдорогой: держите его меньше ста пятидесяти точек.
          title: Частицы
        book:
          lore: sin cos tan asin acos atan atan2 sqrt cbrt abs sign\nfloor ceil round frac exp ln log min max pow hypot mod\nclamp lerp step smooth ease saw tri sq pulse noise if\nrectx recty дают настоящий прямоугольник,\ncellx celly сетку, step4 щелчки по четырём сторонам.
          title: Функции
        clock:
          lore: Пишутся как 93, 93.5, 1:33, 01:33.250 или 01:34.565.\nУ эффекта всегда есть начало и конец.\nСлову давайте от двух секунд, удару хватит трети,\nфону под целый куплет можно и двенадцать.
          title: Таймкоды
        compass:
          lore: x, y и z это координаты, всё остальное свои переменные.\nПишется так: let r=4+sin(T*3);x=r*cos(t);y=r*sin(t)\nt параметр кривой, u второй параметр,\nT секунды с начала эффекта, i номер точки, n их число.\nЕсли синусов нет, то t сам идёт от нуля до единицы.
          title: Формулы
        paper:
