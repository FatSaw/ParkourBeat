          name: &e&lTutorial for you
          lore: \n&fThis is our tutorial level, and you\n&fabsolutely should play through it!\n&fIt covers the most basic mechanics\n&fand elements of the game. Good luck!\n\n&aClick to start
          unavailable: &cThe tutorial level is unavailable right now
        music:
          name: &b&lMusic and resource pack
          lore: \n&fPlay with the music on.\n&fAccept the resource pack when you join.\n\n&fIf you declined it:\n&f1. Add the server to your server list\n&f2. In the server settings allow\n&f   all resource packs\n&f3. Rejoin the server\n\n&fIf the pack still will not load:\n&fturn your VPN off and restart the game,\n&fand if there was no VPN - turn one\n&fon instead and restart.
        rating:
          name: &a&lScore and ranking
          lore: \n&fPP is awarded for completed levels.\n&fThe harder the map and the higher your\n&faccuracy, the more PP you get.\n\n&fModifiers increase the reward\n&fbut make the run harder.\n\n&fA place in the ranking unlocks level creation.
        commands:
          name: &f&lCommands
