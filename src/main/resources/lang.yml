          name: &6&lHow to play
          lore: \n&fHold &eCtrl &fand run forward.\n&fYou may not stop or go backwards.\n\n&fJump exactly on the particle rings:\n&fthe more precise the jump, the more points.\n\n&c&lIMPORTANT: &fturn all particles\n&fup to maximum in the game's\n&fgraphics settings, otherwise\n&fthe track will be invisible!
