    editor:
      missingpath: Тут обычный игрок упадет , потому что именно здесь зона падения. Мы тебя не убиваем, потому что ты ещё не настроил путь из частиц. Как только ты доделаешь путь из частиц - убивать здесь не будет (если здесь, конечно, паркур а не запланированная зона падения)
